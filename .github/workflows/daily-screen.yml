name: daily-screen

on:
  schedule:
    # 盤中每 15 分鐘（13:00–21:45 UTC 涵蓋美東 9:30–16:15，夏令／冬令皆適用）
    # GitHub 的排程常延遲 5–20 分鐘，尖峰時段可能略過個別執行
    - cron: "*/15 13-21 * * 1-5"
    # 收盤後再跑一次，確保拿到收盤報價
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screener
        run: python screener/screen.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: screen $(jq -r '.quote_time // .asof' docs/data/latest.json)"
            git pull --rebase
            git push
          fi
